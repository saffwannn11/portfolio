<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akbar Academy - Simulation Lab</title>
<meta name="description" content="Hands-on aviation, travel and tourism simulators: GDS terminals (Amadeus, Sabre, Galileo) and a Dubai tourism itinerary studio.">
<meta name="theme-color" content="#060913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root {
  --bg: #060913; --bg2: #0b1020; --panel: rgba(255,255,255,.045); --panel2: rgba(255,255,255,.075);
  --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.16);
  --text: #e9edf7; --mute: #8f99b3; --dim: #5d6783;
  --gold: #e8c27a; --gold2: #b98a38; --teal: #4fd1c5; --blue: #6ea8ff; --rose: #ff6b81; --ok: #46d39a; --warn: #ffb454;
  --r: 16px; --r2: 10px;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --disp: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1,h2,h3 { font-family: var(--disp); margin: 0; letter-spacing: -.01em; }
::selection { background: rgba(232,194,122,.35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
.bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(900px 520px at 85% -8%, rgba(110,168,255,.14), transparent 60%),
              radial-gradient(700px 480px at -5% 105%, rgba(232,194,122,.10), transparent 60%),
              radial-gradient(500px 400px at 50% 40%, rgba(79,209,197,.05), transparent 70%); }

/* ===== App shell ===== */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
  background: linear-gradient(180deg, rgba(11,16,32,.92), rgba(6,9,19,.96)); border-right: 1px solid var(--line); backdrop-filter: blur(14px); z-index: 30; }
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 10px; }
.brand b { display: block; font: 700 14px var(--disp); letter-spacing: .16em; }
.brand small { color: var(--gold); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: #1a1305;
  background: linear-gradient(135deg, #f6dca3, #c9953f); box-shadow: 0 6px 24px rgba(232,194,122,.35), inset 0 1px 0 rgba(255,255,255,.5); }
.pal-btn { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); font-size: 13px; }
.pal-btn:hover { border-color: var(--line2); color: var(--text); }
kbd { font: 600 10px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line2); color: var(--mute); background: rgba(255,255,255,.04); }
#nav { display: flex; flex-direction: column; gap: 4px; overflow: auto; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid transparent; position: relative; transition: .2s; }
.nav-item:hover { background: var(--panel); }
.nav-item.on { background: linear-gradient(90deg, rgba(232,194,122,.14), rgba(232,194,122,.02)); border-color: rgba(232,194,122,.28); }
.nav-item.on::before { content: ''; position: absolute; left: -17px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--gold); box-shadow: 0 0 14px var(--gold); }
.ni-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--panel2); font-size: 18px; flex: none; }
.ni-txt b { display: block; font-size: 13.5px; font-weight: 600; }
.ni-txt small { display: block; color: var(--mute); font-size: 11.5px; line-height: 1.25; }
.nav-item.soon { opacity: .55; }
.nav-item em { margin-left: auto; font: 700 9px var(--mono); letter-spacing: .1em; color: var(--gold); border: 1px solid rgba(232,194,122,.4); padding: 2px 5px; border-radius: 5px; font-style: normal; }
.xpbox { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.xp-top { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; }
.lvl { font: 700 10px var(--mono); padding: 3px 7px; border-radius: 6px; background: var(--gold); color: #1a1305; letter-spacing: .08em; }
.xp-bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin: 10px 0 6px; overflow: hidden; }
.xp-bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold2), var(--gold), #fff3d4); transition: width .8s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 12px rgba(232,194,122,.6); }
.xp-sub { font-size: 11px; color: var(--mute); }
.side-foot { font: 11px var(--mono); color: var(--dim); text-align: center; }
.topbar, .scrim { display: none; }

.stage { min-width: 0; padding: 28px 34px 60px; }
.stage.enter > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ===== Shared components ===== */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); }
.eyebrow { font: 600 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--mute); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 11px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 600; font-size: 13.5px; transition: .18s; }
.btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
.btn.gold { background: linear-gradient(135deg, #f6dca3, #c9953f); color: #1c1406; border-color: transparent; box-shadow: 0 8px 26px rgba(201,149,63,.35); }
.btn.gold:hover { filter: brightness(1.07); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.muted { color: var(--mute); }
.mono { font-family: var(--mono); }

/* toasts */
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 9000; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.toast { min-width: 220px; max-width: 340px; padding: 12px 16px; border-radius: 12px; background: rgba(14,20,38,.96); border: 1px solid var(--line2); box-shadow: 0 14px 40px rgba(0,0,0,.5); transform: translateX(30px); opacity: 0; transition: .4s cubic-bezier(.2,.8,.2,1); }
.toast.in { transform: none; opacity: 1; }
.toast b { display: block; font-size: 13.5px; } .toast span { display: block; font-size: 12.5px; color: var(--mute); }
.toast.xp b { color: var(--gold); } .toast.gold { border-color: rgba(232,194,122,.5); background: linear-gradient(135deg, rgba(60,45,18,.97), rgba(14,20,38,.97)); } .toast.gold b { color: var(--gold); }

/* palette */
#palette { position: fixed; inset: 0; z-index: 9500; background: rgba(3,5,12,.6); backdrop-filter: blur(6px); display: grid; place-items: start center; padding-top: 14vh; }
.pal { width: min(560px, 92vw); background: #0d1326; border: 1px solid var(--line2); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: rise .25s both; }
.pal input { width: 100%; padding: 18px 20px; background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--text); font: 16px var(--sans); outline: none; }
.pal ul { list-style: none; margin: 0; padding: 8px; max-height: 50vh; overflow: auto; }
.pal li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.pal li.on, .pal li:hover { background: rgba(232,194,122,.12); }
.pal li small { color: var(--mute); margin-left: auto; font-size: 12px; } .pal li.empty { color: var(--mute); justify-content: center; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 8000; background: rgba(3,5,12,.72); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 18px; overflow: auto; animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal-box { width: min(920px, 100%); max-height: 94vh; overflow: auto; background: linear-gradient(180deg, #11172c, #0a0f1f); border: 1px solid var(--line2); border-radius: 22px; padding: 28px; box-shadow: 0 40px 100px rgba(0,0,0,.65); animation: pop .5s cubic-bezier(.2,.9,.25,1.1) both; position: relative; }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
.modal-x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); font-size: 18px; line-height: 1; }

/* ===== Responsive shell ===== */
@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; width: 290px; transform: translateX(-100%); transition: .3s cubic-bezier(.2,.8,.2,1); }
  .menu-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: .3s; }
  .menu-open .scrim { opacity: 1; pointer-events: auto; }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 12px 16px; background: rgba(6,9,19,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .topbar b { font: 700 13px var(--disp); letter-spacing: .14em; } .topbar span { color: var(--gold); font-size: 12px; }
  #menuBtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); display: grid; gap: 4px; place-content: center; }
  #menuBtn i { display: block; width: 16px; height: 2px; background: var(--text); border-radius: 2px; }
  .stage { padding: 18px 16px 50px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

</style>
<style>
/* ===== Hub ===== */
.hero { position: relative; overflow: hidden; min-height: 430px; border-radius: 24px; padding: 44px; display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(900px 400px at 70% 40%, rgba(20,32,64,.9), rgba(7,11,24,.95)); border: 1px solid var(--line2); box-shadow: 0 30px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,9,19,.92) 0%, rgba(6,9,19,.55) 42%, transparent 70%); pointer-events: none; }
.hero-txt { position: relative; z-index: 2; max-width: 560px; }
.hero h1 { font-size: clamp(32px, 4.4vw, 56px); line-height: 1.04; margin: 14px 0 16px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, #f6dca3, #e8c27a 40%, #4fd1c5); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: #b9c2da; font-size: 16px; max-width: 480px; margin: 0 0 24px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.clocks { position: absolute; z-index: 2; right: 22px; bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.clock { padding: 8px 12px; border-radius: 12px; background: rgba(8,12,26,.72); border: 1px solid var(--line); backdrop-filter: blur(8px); text-align: center; min-width: 78px; }
.clock b { display: block; font: 600 16px var(--mono); letter-spacing: .02em; } .clock small { font: 600 10px var(--mono); color: var(--gold); letter-spacing: .14em; }
.live { position: absolute; z-index: 2; top: 20px; right: 22px; display: flex; align-items: center; gap: 8px; font: 600 11px var(--mono); letter-spacing: .14em; color: var(--mute); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(70,211,154,.7); animation: ping 1.8s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(70,211,154,0); } 100% { box-shadow: 0 0 0 0 rgba(70,211,154,0); } }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0; }
.kpi { padding: 18px 20px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
.kpi::after { content: ''; position: absolute; right: -30px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(232,194,122,.16), transparent 70%); }
.kpi small { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.kpi b { display: block; font: 700 32px var(--disp); margin-top: 4px; }
.kpi span { font-size: 12px; color: var(--dim); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 34px 0 14px; }
.sec-h h2 { font-size: 22px; } .sec-h span { color: var(--mute); font-size: 13px; }

.board { padding: 18px 20px; background: linear-gradient(180deg, #0b0f1c, #070a14); border: 1px solid var(--line2); border-radius: var(--r); font-family: var(--mono); overflow-x: auto; }
.board-h, .board-r { display: grid; grid-template-columns: 78px 100px minmax(240px, 1fr) 70px 150px; gap: 10px; align-items: center; min-width: 640px; }
.board-h { color: var(--dim); font-size: 11px; letter-spacing: .14em; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
.board-r { padding: 11px 0; border-bottom: 1px dashed rgba(255,255,255,.07); cursor: pointer; transition: background .2s; }
.board-r:hover { background: rgba(232,194,122,.06); }
.board-r:last-child { border: 0; }
.flap { display: inline-block; min-width: .72em; margin-right: 2px; padding: 3px 4px; border-radius: 4px; text-align: center; font-weight: 600; font-size: 14px; background: linear-gradient(180deg, #1a2036 49%, #0d1120 51%); color: #f1d9a3; box-shadow: inset 0 -1px 0 rgba(0,0,0,.5); }
.flap.sp { background: none; box-shadow: none; padding: 3px 0; min-width: .4em; }
.st-live { color: var(--ok); } .st-soon { color: var(--warn); }
.st-live .flap { color: #7df0bd; } .st-soon .flap { color: #ffcf8a; }

.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; perspective: 1000px; }
.mcard { position: relative; padding: 22px; border-radius: 20px; background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; gap: 12px; min-height: 250px;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .15s ease-out, border-color .3s; transform-style: preserve-3d; }
.mcard:hover { border-color: rgba(232,194,122,.45); }
.mcard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(232,194,122,.16), transparent 60%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.mcard:hover::before { opacity: 1; }
.mcard .ico { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-size: 26px; background: linear-gradient(135deg, rgba(232,194,122,.25), rgba(79,209,197,.15)); border: 1px solid var(--line2); }
.mcard h3 { font-size: 20px; } .mcard p { margin: 0; color: var(--mute); font-size: 13.5px; }
.mcard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 13px; color: #c3cbe0; }
.mcard li::before { content: '\2713'; color: var(--teal); margin-right: 8px; font-weight: 700; }
.mcard .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mcard.soon { opacity: .6; } .mcard.soon:hover { opacity: .85; }
.ribbon { position: absolute; top: 16px; right: 16px; font: 700 10px var(--mono); letter-spacing: .12em; padding: 4px 8px; border-radius: 6px; }
.ribbon.live { background: rgba(70,211,154,.14); color: var(--ok); border: 1px solid rgba(70,211,154,.4); position: absolute; display: block; }
.ribbon.soonr { background: rgba(255,180,84,.12); color: var(--warn); border: 1px solid rgba(255,180,84,.35); }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); filter: grayscale(1); opacity: .5; }
.ach.on { filter: none; opacity: 1; border-color: rgba(232,194,122,.4); background: linear-gradient(135deg, rgba(232,194,122,.12), transparent); }
.ach .m { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #f6dca3, #b98a38); color: #1c1406; font-weight: 800; flex: none; }
.ach b { display: block; font-size: 13.5px; } .ach small { color: var(--mute); font-size: 12px; line-height: 1.3; display: block; }

@media (max-width: 920px) {
  .hero { padding: 26px 20px 120px; min-height: 480px; } .hero::after { background: linear-gradient(180deg, rgba(6,9,19,.9), rgba(6,9,19,.4) 60%, transparent); }
  .kpis { grid-template-columns: repeat(2, 1fr); } .clocks { max-width: 100%; left: 14px; right: 14px; bottom: 14px; justify-content: flex-start; } .clock { min-width: 64px; padding: 6px 8px; } .clock b { font-size: 13px; } .live { display: none; }
}

.soon-page { max-width: 640px; margin: 8vh auto 0; padding: 48px 36px; text-align: center; }
.soon-ico { width: 84px; height: 84px; margin: 18px auto; border-radius: 24px; display: grid; place-items: center; font-size: 42px; background: linear-gradient(135deg, rgba(232,194,122,.25), rgba(79,209,197,.15)); border: 1px solid var(--line2); }
.soon-page h2 { font-size: 32px; } .soon-page p { color: var(--mute); }
.soon-page ul { list-style: none; padding: 0; margin: 18px 0 26px; display: grid; gap: 8px; color: #c3cbe0; } .soon-page li::before { content: '\2713'; color: var(--teal); margin-right: 8px; }

</style>
<style>
/* ===== GDS Lab ===== */
.gds-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.gds-head h2 { font-size: 30px; margin-top: 4px; }
.seg-tabs { display: inline-flex; padding: 4px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); }
.seg-tabs button { border: 0; background: none; padding: 8px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--mute); transition: .2s; }
.seg-tabs button.on { background: linear-gradient(135deg, #f6dca3, #c9953f); color: #1c1406; box-shadow: 0 4px 16px rgba(201,149,63,.35); }
.gds-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.fine { color: var(--dim); font-size: 12px; margin-top: 18px; }

.termwrap { --fg: #cfe3ff; --dimfg: #6f87b4; --bgc: #07142e; --hi: #fff; --acc: #5cc8ff; --err: #ff6b6b; --okc: #6dffa8;
  border-radius: 18px; overflow: hidden; border: 1px solid var(--line2); background: var(--bgc); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03); position: relative; display: flex; flex-direction: column; height: 640px; transition: background .5s; }
.th-sabre { --fg: #7dff9a; --dimfg: #3c9c56; --bgc: #020a05; --hi: #d6ffe0; --acc: #ffd24a; --err: #ff5a5a; --okc: #9dffb6; }
.th-galileo { --fg: #ffc86b; --dimfg: #a07a32; --bgc: #120b02; --hi: #fff1d1; --acc: #5fd7ff; --err: #ff6a5a; --okc: #b8ff8a; }
.tbar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.07); font: 600 11px var(--mono); letter-spacing: .08em; color: var(--dimfg); }
.tbar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .tbar i:nth-child(2) { background: #febc2e; } .tbar i:nth-child(3) { background: #28c840; }
.tbar b { margin-left: 8px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; } .tbar span { color: var(--acc); }
.screen { flex: 1; overflow: auto; padding: 16px 18px; font: 13.5px/1.55 var(--mono); color: var(--fg); text-shadow: 0 0 8px color-mix(in srgb, var(--fg) 45%, transparent); position: relative;
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
.screen::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 25%, transparent); }

<script>
/* Akbar Academy Simulation Lab - core: module registry, router, XP, toasts, palette, effects.
   A simulator is just an object passed to AA.register({...}) - see README.md. */
(function () {
  'use strict';
  const AA = (window.AA = window.AA || {});
  AA.modules = [];
  AA.byId = {};
  AA.current = null;

  AA.$ = (s, r) => (r || document).querySelector(s);
  AA.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  AA.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  AA.pad = (n, l) => String(n).padStart(l || 2, '0');
  AA.money = (n) => Math.round(n).toLocaleString('en-US');
  AA.register = (m) => { AA.modules.push(m); AA.byId[m.id] = m; };

  /* ---------- persistent state ---------- */
  const KEY = 'akbar-sim-v1';
  const state = (AA.state = { xp: 0, done: {}, best: {}, ach: {} });
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage blocked */ }
  AA.save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };

  const need = (l) => 120 * (l - 1) * (l - 1);
  const TITLES = ['Trainee', 'Agent', 'Senior Agent', 'Specialist', 'Consultant', 'Travel Director'];
  AA.levelInfo = () => {
    let l = 1;
    while (state.xp >= need(l + 1)) l++;
    const a = need(l), b = need(l + 1);
    return { level: l, title: TITLES[Math.min(l - 1, TITLES.length - 1)], pct: (state.xp - a) / (b - a), into: state.xp - a, span: b - a };
  };
  AA.addXP = (n, why) => {
    const before = AA.levelInfo().level;
    state.xp += n; AA.save(); AA.toast('+' + n + ' XP', why || '', 'xp'); renderXP();
    const after = AA.levelInfo();
    if (after.level > before) { setTimeout(() => { AA.toast('Level ' + after.level + ' reached', 'You are now: ' + after.title, 'gold'); AA.confetti(); }, 600); }
  };

  const ACH = {
    first_pnr: ['First Blood', 'Completed your first GDS mission'],
    ticketed: ['Ticket Issued', 'Issued a live e-ticket in the GDS lab'],
    clean: ['Clean Sheet', 'Finished a mission with zero errors'],
    speed: ['Speed Demon', 'Finished a mission in under 90 seconds'],
    all_gds: ['Three Systems', 'Completed a mission in Amadeus, Sabre and Galileo'],
    dubai_pro: ['Dubai Insider', 'Scored 90+ on a Dubai itinerary'],
    profit: ['Margin Master', 'Won a Dubai brief with 18%+ margin'],
  };
  AA.ACH = ACH;
  AA.unlock = (id) => {
    if (state.ach[id] || !ACH[id]) return;
    state.ach[id] = Date.now(); AA.save();
    AA.toast('Achievement unlocked', ACH[id][0] + ' - ' + ACH[id][1], 'gold');
    if (AA.current && AA.current.onAchievement) AA.current.onAchievement(id);
  };

  /* ---------- toasts ---------- */
  AA.toast = (title, msg, kind) => {
    const box = AA.$('#toasts'); if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.innerHTML = '<b>' + AA.esc(title) + '</b>' + (msg ? '<span>' + AA.esc(msg) + '</span>' : '');
    box.appendChild(t);
    requestAnimationFrame(() => t.classList.add('in'));
    setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 400); }, 3600);
  };

  /* ---------- animated number ---------- */
  AA.countTo = (el, to, opts) => {
    opts = opts || {};
    const from = parseFloat(el.dataset.v || '0') || 0, dur = opts.dur || 700, t0 = performance.now();
    el.dataset.v = to;
    const fmt = opts.fmt || ((v) => AA.money(v));
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (opts.prefix || '') + fmt(from + (to - from) * e) + (opts.suffix || '');
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  };

  /* ---------- confetti ---------- */
  AA.confetti = () => {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
    document.body.appendChild(c);
    const W = (c.width = innerWidth), H = (c.height = innerHeight), g = c.getContext('2d');
    const cols = ['#e8c27a', '#4fd1c5', '#6ea8ff', '#ff6b81', '#ffffff'];
    const P = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: H * .6, vx: (Math.random() - .5) * 16, vy: -Math.random() * 18 - 6, s: Math.random() * 7 + 3, r: Math.random() * 6, vr: Math.random() * .3 - .15, c: cols[(Math.random() * cols.length) | 0] }));
    let f = 0;
    (function tick() {
      g.clearRect(0, 0, W, H);
      P.forEach((p) => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.max(0, 1 - f / 110); g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
      if (++f < 120) requestAnimationFrame(tick); else c.remove();
    })();
  };

  /* ---------- sidebar + router ---------- */
  function renderXP() {
    const i = AA.levelInfo(), box = AA.$('#xpbox'); if (!box) return;
    box.innerHTML =
      '<div class="xp-top"><span class="lvl">LVL ' + i.level + '</span><span>' + AA.esc(i.title) + '</span></div>' +
      '<div class="xp-bar"><i style="width:' + Math.round(i.pct * 100) + '%"></i></div>' +
      '<div class="xp-sub">' + state.xp + ' XP &middot; ' + (i.span - i.into) + ' to next level</div>';
  }

  function renderNav() {
    const nav = AA.$('#nav');
    nav.innerHTML = AA.modules.map((m) =>
      '<a class="nav-item' + (m.status === 'soon' ? ' soon' : '') + '" href="#/' + m.id + '" data-id="' + m.id + '">' +
      '<span class="ni-ico">' + m.icon + '</span><span class="ni-txt"><b>' + AA.esc(m.title) + '</b><small>' + AA.esc(m.tagline) + '</small></span>' +
      (m.status === 'soon' ? '<em>SOON</em>' : '') + '</a>').join('');
  }

  function route() {
    const id = (location.hash.replace(/^#\/?/, '') || 'hub').split('/')[0];
    const m = AA.byId[id] || AA.byId.hub;
    if (AA.current && AA.current.unmount) { try { AA.current.unmount(); } catch (e) { console.error(e); } }
    const stage = AA.$('#stage');
    stage.className = 'stage m-' + m.id;
    stage.innerHTML = '';
    AA.current = m;
    AA.$$('.nav-item').forEach((a) => a.classList.toggle('on', a.dataset.id === m.id));
    document.body.classList.remove('menu-open');
    document.title = m.title + ' - Akbar Academy Simulation Lab';
    stage.scrollTop = 0; window.scrollTo(0, 0);
    m.mount(stage);
    stage.classList.add('enter');
    setTimeout(() => stage.classList.remove('enter'), 600);
  }

  /* ---------- command palette (Ctrl/Cmd + K) ---------- */
  function palette() {
    if (AA.$('#palette')) return;
    const wrap = document.createElement('div');
    wrap.id = 'palette';
    wrap.innerHTML = '<div class="pal"><input placeholder="Jump to a simulator...  (Esc to close)" autofocus><ul></ul></div>';
    document.body.appendChild(wrap);
    const input = AA.$('input', wrap), ul = AA.$('ul', wrap);
    let sel = 0, items = [];
    const draw = () => {
      const q = input.value.toLowerCase();
      items = AA.modules.filter((m) => (m.title + ' ' + m.tagline).toLowerCase().includes(q));
      ul.innerHTML = items.map((m, i) => '<li class="' + (i === sel ? 'on' : '') + '" data-i="' + i + '"><span>' + m.icon + '</span><b>' + AA.esc(m.title) + '</b><small>' + AA.esc(m.tagline) + '</small></li>').join('') || '<li class="empty">Nothing found</li>';
    };
    const go = (i) => { if (items[i]) { location.hash = '#/' + items[i].id; close(); } };
    const close = () => { wrap.remove(); document.removeEventListener('keydown', key, true); };
    const key = (e) => {
      if (e.key === 'Escape') { close(); }
      else if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { go(sel); e.preventDefault(); }
    };
    document.addEventListener('keydown', key, true);
    input.addEventListener('input', () => { sel = 0; draw(); });
    ul.addEventListener('click', (e) => { const li = e.target.closest('li[data-i]'); if (li) go(+li.dataset.i); });
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    draw(); input.focus();
  }

  AA.start = () => {
    renderNav(); renderXP();
    AA.$('#menuBtn').addEventListener('click', () => document.body.classList.toggle('menu-open'));
    AA.$('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
    AA.$('#palBtn').addEventListener('click', palette);
    document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette(); } });
    window.addEventListener('hashchange', route);
    route();
  };
})();

</script>

  const ZONES = [['DXB','Asia/Dubai'],['LON','Europe/London'],['NYC','America/New_York'],['SIN','Asia/Singapore'],['SYD','Australia/Sydney']];

  function inPoly(x, y, p) {
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      if (((p[i][1] > y) !== (p[j][1] > y)) && (x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0])) c = !c;
    }

  function startMap(cv) {
    const ctx = cv.getContext('2d');
    let W, H, s, ox, oy, dots = [];
    const geo = AA.geo, step = 2.4;
    for (let lat = 80; lat > -58; lat -= step) for (let lon = -178; lon < 180; lon += step) {
      if (geo.land.some((p) => inPoly(lon, lat, p))) dots.push([lon, lat]);
    }
    const P = (lon, lat) => [ox + (lon + 180) * s, oy + (82 - lat) * s];
    function size() {
      const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
      s = Math.max(W / 360, H / 140);
      ox = Math.min(0, Math.max(W - 360 * s, W * 0.56 - 235 * s));
      oy = (H - 140 * s) / 2;
    }
    size();
    const ro = new ResizeObserver(size); ro.observe(cv);
    const routes = ROUTES.map((r, i) => ({ a: geo.airports[r[0]], b: geo.airports[r[1]], off: i * 0.37, sp: 0.00011 + (i % 5) * 0.00002 }));
    function frame(now) {
      if (!alive) { ro.disconnect(); return; }
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(160,178,220,.30)';
      const rr = Math.max(0.9, s * 0.42);
      dots.forEach((d) => { const p = P(d[0], d[1]); ctx.beginPath(); ctx.arc(p[0], p[1], rr, 0, 6.283); ctx.fill(); });
      routes.forEach((r) => {
        const a = P(r.a.lon, r.a.lat), b = P(r.b.lon, r.b.lat);
        const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
        const c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - len * 0.28];
        const at = (t) => { const u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; };
        ctx.strokeStyle = 'rgba(232,194,122,.10)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]); ctx.stroke();
        const t = ((now * r.sp + r.off) % 1.5);
        if (t <= 1) {
          const t0 = Math.max(0, t - 0.22);
          for (let k = 0; k < 14; k++) {
            const u0 = t0 + (t - t0) * (k / 14), u1 = t0 + (t - t0) * ((k + 1) / 14), p0 = at(u0), p1 = at(u1);
            ctx.strokeStyle = 'rgba(255,224,160,' + (0.05 + 0.85 * k / 14) + ')'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
          }
          const h = at(t);
          const g = ctx.createRadialGradient(h[0], h[1], 0, h[0], h[1], 9);
          g.addColorStop(0, 'rgba(255,240,200,1)'); g.addColorStop(1, 'rgba(232,194,122,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h[0], h[1], 9, 0, 6.283); ctx.fill();
        }
      });
      NODES.forEach((c) => {
        const a = geo.airports[c], p = P(a.lon, a.lat), hq = c === 'DXB';
        ctx.fillStyle = hq ? '#e8c27a' : '#4fd1c5'; ctx.beginPath(); ctx.arc(p[0], p[1], hq ? 4 : 2.6, 0, 6.283); ctx.fill();
        const ph = ((now / 1600) + c.charCodeAt(0) * 0.13) % 1;
        ctx.strokeStyle = (hq ? 'rgba(232,194,122,' : 'rgba(79,209,197,') + (0.55 * (1 - ph)) + ')'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(p[0], p[1], (hq ? 5 : 3) + ph * (hq ? 20 : 11), 0, 6.283); ctx.stroke();
        if (W > 560 || hq) { ctx.fillStyle = hq ? '#f6dca3' : 'rgba(200,210,235,.7)'; ctx.font = (hq ? '700 11px' : '600 9.5px') + ' JetBrains Mono, monospace'; ctx.fillText(c, p[0] + 8, p[1] - 6); }
      });
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  function flap(el, text, delay) {
    el.innerHTML = '';
    const set = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    text.split('').forEach((ch, i) => {
      const sp = document.createElement('span'); sp.className = 'flap' + (ch === ' ' ? ' sp' : ''); sp.textContent = ch === ' ' ? ' ' : ' ';
      el.appendChild(sp);
      if (ch === ' ') return;
      let n = 0; const total = 5 + ((i * 3) % 6);
      setTimeout(function tick() {
        if (!alive) return;
        n++; sp.textContent = n >= total ? ch : set[(Math.random() * set.length) | 0];
        if (n < total) setTimeout(tick, 45);
      }, (delay || 0) + i * 35);

  }

        '<div class="hero-cta"><a class="btn gold" href="#/gds">Launch GDS Lab &rarr;</a><a class="btn" href="#/dubai">Plan a Dubai trip</a></div></div>' +
        '<div class="clocks" id="clocks"></div>' +
      '</section>' +
      '<section class="kpis">' +
        '<div class="kpi"><small>Missions cleared</small><b data-c="' + done + '">0</b><span>across all simulators</span></div>' +
        '<div class="kpi"><small>Total XP</small><b data-c="' + AA.state.xp + '">0</b><span>' + esc(AA.levelInfo().title) + ' &middot; level ' + AA.levelInfo().level + '</span></div>' +
        '<div class="kpi"><small>Best GDS score</small><b data-c="' + bestG + '">0</b><span>out of 1000</span></div>' +
        '<div class="kpi"><small>Best Dubai score</small><b data-c="' + bestD + '">0</b><span>client satisfaction / 100</span></div>' +
      '</section>' +

        mods.map((m, i) => '<div class="board-r" data-go="' + m.id + '"><span class="f" data-t="' + (m.status === 'soon' ? '--:--' : 'NOW') + '"></span><span class="f" data-t="AK' + (101 + i) + '"></span><span class="f" data-t="' + esc(m.title.toUpperCase()) + '"></span><span class="f" data-t="' + String.fromCharCode(65 + i) + (1 + i) + '"></span><span class="f ' + (m.status === 'soon' ? 'st-soon' : 'st-live') + '" data-t="' + (m.status === 'soon' ? 'DELAYED' : 'BOARDING') + '"></span></div>').join('') +
      '</section>' +
      '<div class="sec-h"><h2>Simulators</h2><span>Each one is a plug-in module - add more any time</span></div>' +
      '<section class="mods">' + mods.map((m) =>
        '<a class="mcard' + (m.status === 'soon' ? ' soon' : '') + '" href="#/' + m.id + '">' +
          '<span class="ribbon ' + (m.status === 'soon' ? 'soonr' : 'live') + '">' + (m.status === 'soon' ? 'COMING SOON' : 'LIVE') + '</span>' +
          '<div class="ico">' + m.icon + '</div><h3>' + esc(m.title) + '</h3><p>' + esc(m.pitch || m.tagline) + '</p>' +
          '<ul>' + (m.features || []).map((f) => '<li>' + esc(f) + '</li>').join('') + '</ul>' +

      '</section>' +

      '<section class="ach-grid">' + Object.keys(AA.ACH).map((k) => '<div class="ach ' + (AA.state.ach[k] ? 'on' : '') + '"><div class="m">' + (AA.state.ach[k] ? '★' : '?') + '</div><div><b>' + esc(AA.ACH[k][0]) + '</b><small>' + esc(AA.ACH[k][1]) + '</small></div></div>').join('') + '</section>';

    startMap($('#map', el));

        if (!f) { e('LINE ' + a.line + ' NOT IN DISPLAY'); res.error = true; break; }
        if (!(a.cls in f.seats)) { e('INVALID BOOKING CLASS ' + a.cls); res.error = true; break; }
        if (f.seats[a.cls] < a.n) { e(f.seats[a.cls] === 0 ? 'NO SEATS - CLASS ' + a.cls + ' CLOSED' : 'ONLY ' + f.seats[a.cls] + ' SEAT(S) AVAILABLE IN ' + a.cls); res.error = true; break; }
        const last = p.segs[p.segs.length - 1];
        if (last && (f.date < last.fl.date)) { e('SEGMENT DATES NOT CHRONOLOGICAL'); res.error = true; break; }
        p.segs.push({ fl: f, cls: a.cls, n: a.n }); p.priced = false;
        ok(id === 'amadeus' ? 'OK' : 'SEGMENT SOLD');
        p.segs.forEach((sg, i) => L(segLine(id, sg, i), 'seg'));
        break;
      }
      case 'name': {
        let bad = false;
        a.names.forEach((n) => {
          if (!N.test(n)) { e('INVALID NAME FORMAT - USE SURNAME/FIRSTNAME TITLE'); bad = true; return; }
          if (p.names.some((x) => nameKey(x) === nameKey(n))) { e('DUPLICATE NAME ' + nameKey(n)); bad = true; return; }

      case 'tk': p.tk = a.v; ok(); break;
      case 'rf': p.rf = a.v; ok(); break;

        else {

          else if ((i -= nP) === 0 && p.tk) p.tk = null; else if (i === (p.tk ? 1 : 0) && p.rf) p.rf = null; else { e('ELEMENT ' + k + ' NOT FOUND'); res.error = true; break; }
        }

      }

        const miss = [];
        if (!p.names.length) miss.push(id === 'amadeus' ? 'NAME' : 'NAME FIELD'); if (!p.segs.length) miss.push('ITINERARY');
        if (!p.phones.length) miss.push(id === 'amadeus' ? 'CONTACT (AP)' : 'PHONE FIELD'); if (!p.tk) miss.push('TICKETING ARRANGEMENT');
        if (!p.rf) miss.push('RECEIVED FROM'); if (p.segs.length && p.segs.some((sg) => sg.n !== p.names.length)) miss.push('SEATS (' + p.segs[0].n + ') = PASSENGERS (' + p.names.length + ')');
        if (miss.length) { e('UNABLE TO END - NEED: ' + miss.join(', ')); res.error = true; break; }
        const upd = !!p.loc; if (!p.loc) p.loc = loc6();
        s.saved[p.loc] = pnrCopy2(p);
        ok(upd ? 'PNR UPDATED' : 'PNR CREATED  RECORD LOCATOR ' + p.loc);
        if (a.redisplay) pnrLines(s).forEach((l) => L(l, 'seg'));
        break;
      }
      case 'redisp': if (!p.names.length && !p.segs.length) { e('NO ACTIVE PNR'); res.error = true; break; } pnrLines(s).forEach((l) => L(l, 'seg')); break;
      case 'retrieve': { const sv = s.saved[a.loc]; if (!sv) { e('RECORD LOCATOR ' + a.loc + ' NOT FOUND'); res.error = true; break; } s.pnr = pnrCopy2(sv); pnrLines(s).forEach((l) => L(l, 'seg')); break; }
      case 'ignore': s.pnr = p.loc && s.saved[p.loc] ? pnrCopy2(s.saved[p.loc]) : blank(); s.lastAvail = null; ok(id === 'amadeus' ? 'IGNORED' : 'IGNORE - NO CHANGES SAVED'); break;
      case 'encode': {
        const r = AA.geo.search(a.v);
        if (!r.length) { e('NO MATCH FOR ' + a.v); res.error = true; break; }
        s.looked = true; r.slice(0, 5).forEach((x) => L('  ' + x.cityCode + (x.cityCode !== x.code ? '/' + x.code : '').padEnd(4) + ' ' + x.city.toUpperCase() + ' - ' + x.name.toUpperCase() + ' ' + x.country, 'seg'));
        break;
      }
      case 'decode': {
        const r = AA.geo.resolve(a.v);
        if (!r) { e('CODE NOT FOUND'); res.error = true; break; }
        s.looked = true; L('  ' + r.code + '  ' + r.city.toUpperCase() + ' - ' + r.name.toUpperCase() + ' ' + r.country, 'seg');
        break;
      }
      case 'fd': {
        const o = AA.geo.resolve(a.o), d = AA.geo.resolve(a.d);
        if (!o || !d) { e('INVALID CITY/AIRPORT'); res.error = true; break; }
        const km = AA.geo.dist(o, d);
        L('FARE DISPLAY  ' + o.code + '-' + d.code + '  (ONE WAY, USD, SIMULATED)', 'hi');
        CLASSES.forEach((c) => L('  ' + c + '   ' + String(baseFare(km, c)).padStart(6) + '.00', 'seg'));
        break;
      }
      case 'price': {
        if (!p.segs.length || !p.names.length) { e('NEED ITINERARY AND NAME BEFORE PRICING'); res.error = true; break; }
        const fr = fareFor(s); s.fare = fr; p.priced = true;
        L('FARE QUOTE - ' + fr.pax + ' PASSENGER(S) ADT   CURRENCY USD (SIMULATED)', 'hi');
        fr.lines.forEach((ln, i) => { L(' ' + (i + 1) + ' ' + ln.seg + ' ' + ln.al + ' CLASS ' + ln.cls + '   FARE ' + ln.base.toFixed(2), 'seg'); L('     TAXES ' + ln.taxes.map((t) => t[0] + ' ' + t[1].toFixed(2)).join('  '), 'dim'); });
        L('PER PAX  FARE ' + fr.fare.toFixed(2) + '  TAX ' + fr.tax.toFixed(2) + '  TOTAL ' + fr.total.toFixed(2), 'ok');
        L('GRAND TOTAL ' + (fr.total * fr.pax).toFixed(2) + ' USD', 'ok');
        break;
      }
      case 'issue': {
        if (!p.loc) { e('NO RECORD LOCATOR - END TRANSACTION FIRST (ER)'); res.error = true; break; }
        if (!p.priced) { e(id === 'amadeus' ? 'NO FARE STORED - PRICE FIRST (FXP)' : 'NO PRICING RECORD - PRICE FIRST'); res.error = true; break; }
        if (p.tickets.length) { e('TICKET ALREADY ISSUED'); res.error = true; break; }
        const fr = s.fare, R = rng(p.loc + 'tkt'), num = p.segs[0].fl.al; const al = AIRLINES.find((x) => x[0] === num);
        p.names.forEach((n) => { let d = ''; for (let i = 0; i < 10; i++) d += Math.floor(R() * 10); p.tickets.push({ no: al[2] + '-' + d, name: nameKey(n), total: fr.total }); });

  }
  function pnrCopy2(p) { // keep Date objects intact

  /* ---------- mission evaluation ---------- */
  function checks(s) {
    const sp = s.spec, p = s.pnr, c = [];
    if (sp.lookup) c.push(['Find the airport code (encode/decode)', s.looked]);
    c.push(['Passenger name(s): ' + sp.names.map((n) => n[0] + '/' + n[1]).join(' & '), sp.names.every((n) => p.names.some((x) => nameKey(x) === n[0] + '/' + n[1])) && p.names.length === sp.names.length]);
    sp.legs.forEach((l, i) => { const sg = p.segs[i]; c.push(['Segment ' + (i + 1) + ': ' + l.o + '-' + l.d + ' ' + l.date + ' class ' + l.cls + ' x' + sp.pax, !!sg && sg.fl.o.code === l.o && sg.fl.d.code === l.d && fmtD(sg.fl.date) === l.date && sg.cls === l.cls && sg.n === sp.pax]); });
    c.push(['Phone contact', p.phones.length > 0]); c.push(['Ticketing arrangement', !!p.tk]); c.push(['Received from', !!p.rf]);
    c.push(['End transaction (record locator)', !!p.loc]);
    if (sp.ticket) { c.push(['Price the itinerary', p.priced]); c.push(['Issue e-ticket', p.tickets.length === sp.pax]); }
    return c;
  }
  function nextHint(s) {
    const dl = s.dl, sp = s.spec, p = s.pnr;
    if (sp.lookup && !s.looked) return { cmd: dl.enc('SINGAPORE'), why: 'Find the code for Singapore first.' };
    const need = sp.legs[p.segs.length];
    if (need && p.segs.length < sp.legs.length) {
      const av = s.lastAvail;
      if (!av || av.o !== need.o || av.d !== need.d || av.date !== need.date) return { cmd: dl.avail(need.date, need.o, need.d), why: 'Check availability for leg ' + (p.segs.length + 1) + '.' };
      const i = av.flights.findIndex((f) => f.seats[need.cls] >= sp.pax);
      if (i < 0) return { cmd: dl.avail(need.date, need.o, need.d), why: 'No seats - try again.' };
      return { cmd: dl.sell(sp.pax, need.cls, i + 1), why: 'Sell class ' + need.cls + ' on line ' + (i + 1) + '.' };
    }
    for (const n of sp.names) if (!p.names.some((x) => nameKey(x) === n[0] + '/' + n[1])) return { cmd: dl.mkName(n[0] + '/' + n[1] + ' ' + n[2]), why: 'Add the passenger name.' };
    if (!p.phones.length) return { cmd: dl.phone, why: 'A contact phone is mandatory.' };
    if (!p.tk) { const d = new Date(); d.setDate(d.getDate() + 3); return { cmd: dl.tk(fmtD(d)), why: 'Set a ticketing time limit.' }; }
    if (!p.rf) return { cmd: dl.rf, why: 'Say who made the booking.' };
    if (!p.loc) return { cmd: dl.end, why: 'Save the booking.' };
    if (sp.ticket && !p.priced) return { cmd: dl.price, why: 'Price before ticketing.' };
    if (sp.ticket && !p.tickets.length) return { cmd: dl.issue, why: 'Issue the e-ticket.' };
    return null;
  }

    $('#planner').innerHTML = st.days.map((day, d) => {
      const last = d === st.days.length - 1;
      return '<div class="day" style="--dc:' + DAYCOL[d % 6] + '"><div class="dh"><b>Day ' + (d + 1) + '</b><span>' + (d === 0 ? 'Arrival' : last ? 'Departure' : 'Explore') + '</span></div>' +
        day.map((v, s) => {
          const lw = lockedWhy(d, s);
          if (lw) return '<div class="slot lock"><small>' + SLN[SL[s]] + '</small><div>&#9992; ' + lw + '</div></div>';
          if (v && v[0] === '~') return '<div class="slot cont" data-d="' + d + '" data-s="' + s + '"><small>' + SLN[SL[s]] + '</small><div>&#8627; ' + esc(ACT[v.slice(1)].name) + ' (continued)</div><button class="x" data-rm="' + d + ',' + s + '" aria-label="Remove">&times;</button></div>';
          if (v) { const a = ACT[v]; return '<div class="slot full" data-d="' + d + '" data-s="' + s + '" style="--c:' + D.cats[a.cat][1] + '"><small>' + SLN[SL[s]] + '</small><div class="sf"><span>' + a.e + '</span><b>' + esc(a.name) + '</b></div><button class="x" data-rm="' + d + ',' + s + '" aria-label="Remove">&times;</button></div>'; }
          return '<div class="slot empty" data-d="' + d + '" data-s="' + s + '"><small>' + SLN[SL[s]] + '</small><div>Drop here</div></div>';
        }).join('') + '</div>';
    }).join('');
  }

  function renderSide(c) {
    const b = c.b, over = c.price > b.budget, win = c.score >= 75 && !over;
    const pctB = Math.min(130, c.ratio * 100);
    const R = 52, circ = 2 * Math.PI * R;
    const col = c.score >= 85 ? 'var(--ok)' : c.score >= 65 ? 'var(--gold)' : 'var(--rose)';
    $('#dside').innerHTML =
      '<div class="card mapcard">' + mapSVG(c) + '<div class="mleg">' + Object.keys(D.cats).map((k) => '<span><i style="background:' + D.cats[k][1] + '"></i>' + D.cats[k][0] + '</span>').join('') + '<span><i class="star"></i>Hotel</span></div><div class="mnote">Illustrative map. Pins show the day number.</div></div>' +
      '<div class="card scorecard"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="' + R + '" class="trk"/><circle cx="60" cy="60" r="' + R + '" class="val" style="stroke:' + col + ';stroke-dasharray:' + circ.toFixed(1) + ';stroke-dashoffset:' + (circ * (1 - c.score / 100)).toFixed(1) + '"/></svg><div><b id="scoreN" data-v="0">0</b><small>SATISFACTION</small></div></div>' +
        '<div class="parts">' + c.parts.map((p) => '<div class="pt"><span>' + p[0] + '</span><div class="bar"><i style="width:' + Math.round(p[1] / p[2] * 100) + '%;background:' + (p[1] / p[2] > .8 ? 'var(--ok)' : p[1] / p[2] > .5 ? 'var(--gold)' : 'var(--rose)') + '"></i></div><em>' + p[1].toFixed(1) + '/' + p[2] + '</em></div>').join('') + '</div></div>' +
      '<div class="card costcard"><div class="bud"><div class="bt"><span>Selling price vs budget</span><b class="' + (over ? 'bad' : 'good') + '">' + (over ? '+' : '') + Math.round((c.ratio - 1) * 100) + '%</b></div><div class="bbar"><i style="width:' + Math.min(100, pctB / 1.3) + '%;background:' + (over ? 'var(--rose)' : 'var(--ok)') + '"></i><u style="left:' + (100 / 1.3) + '%"></u></div></div>' +
        '<table class="ct">' +
          '<tr><td>Experiences</td><td>' + money(c.cAct) + '</td></tr><tr><td>Hotel (' + b.nights + ' nights x ' + b.rooms + ' room' + (b.rooms > 1 ? 's' : '') + ')</td><td>' + money(c.cHotel) + '</td></tr><tr><td>Transport</td><td>' + money(c.cTr) + '</td></tr><tr><td>UAE visas (' + c.pax + ')</td><td>' + money(c.cVisa) + '</td></tr><tr><td>Airport transfers</td><td>' + money(c.cXfer) + '</td></tr>' +
          '<tr class="sub"><td>Net cost</td><td>AED ' + money(c.cost) + '</td></tr></table>' +
        '<label class="mg"><span>Your margin <b id="mgv">' + st.margin + '%</b></span><input type="range" id="mg" min="8" max="30" value="' + st.margin + '"></label>' +
        '<div class="tot2"><div><small>CLIENT PRICE</small><b id="priceN" data-v="0">0</b></div><div><small>PER PERSON</small><b id="ppN" data-v="0">0</b></div><div><small>YOUR PROFIT</small><b id="profN" class="gld" data-v="0">0</b></div></div></div>' +
      '<div class="card coach"><h4>&#129489;&#8205;&#127979; Coach says</h4><ul>' + (c.tips.length ? c.tips.map((t) => '<li>' + esc(t) + '</li>').join('') : '<li class="good">Flawless plan. Time to send the proposal.</li>') + '</ul>' +
        '<button class="btn gold wide" id="genBtn" ' + (c.placed.length ? '' : 'disabled') + '>' + (win ? '✨ Send proposal to client' : 'Preview proposal') + '</button></div>';
    AA.countTo($('#scoreN'), c.score, { dur: 600 });
    AA.countTo($('#priceN'), Math.round(c.price), { prefix: 'AED ' }); AA.countTo($('#ppN'), Math.round(c.price / c.pax), { prefix: 'AED ' }); AA.countTo($('#profN'), Math.round(c.profit), { prefix: 'AED ' });
    $('#mg').addEventListener('input', (e) => { st.margin = +e.target.value; $('#mgv').textContent = st.margin + '%'; });
    $('#mg').addEventListener('change', update);
    $('#genBtn').addEventListener('click', () => proposal(c));
  }

  function update() {
    renderPlanner();
    $$('.hcard', el).forEach((x) => x.classList.toggle('on', x.dataset.h === st.hotel));
    $$('.tcard', el).forEach((x) => x.classList.toggle('on', x.dataset.t === st.transport));
    markLib();
    const c = compute(); st.last = c; renderSide(c);
  }

  function wire() {
    const left = $('#dleft');
    left.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]'); if (rm) { const [d, s] = rm.dataset.rm.split(',').map(Number); remove(d, s); update(); return; }
      const h = e.target.closest('[data-h]'); if (h) { st.hotel = h.dataset.h; update(); return; }
      const t = e.target.closest('[data-t]'); if (t) { st.transport = t.dataset.t; update(); return; }
      const f = e.target.closest('[data-f]'); if (f) { st.filter = f.dataset.f; $$('#fchips button').forEach((x) => x.classList.toggle('on', x === f)); renderLib(); return; }
      const ac = e.target.closest('.acard');
      if (ac) {
        const a = ACT[ac.dataset.a];
        if (ac.classList.contains('in')) { toast('Already in your plan', 'Remove it from the planner to move it.'); return; }
        const why = !inSeason(a, brief().month) ? 'Closed in ' + MN[brief().month - 1] : a.cost[1] === null && brief().kids ? 'Adults only - this client has children' : '';
        if (why) { toast(a.name, why); return; }
        const o = autoAdd(a);
        if (!o) { toast('No free slot', 'Every suitable slot is taken - free one up first.'); return; }
        update(); const sl = $('.slot[data-d="' + o[0] + '"][data-s="' + o[1] + '"]'); if (sl) { sl.classList.add('flash'); sl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      }
    });
    $('#fq').addEventListener('input', (e) => { st.q = e.target.value; renderLib(); });
    /* drag & drop */
    left.addEventListener('dragstart', (e) => {
      const ac = e.target.closest('.acard'); if (!ac) return;
      dragId = ac.dataset.a; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'copy';
      const a = ACT[dragId]; $$('.slot', el).forEach((sl) => { if (sl.dataset.d === undefined) return; sl.classList.add(canPlace(a, +sl.dataset.d, +sl.dataset.s) ? 'cant' : 'can'); });
    });
    left.addEventListener('dragend', () => { dragId = null; $$('.slot', el).forEach((sl) => sl.classList.remove('can', 'cant', 'over')); });
    left.addEventListener('dragover', (e) => { const sl = e.target.closest('.slot'); if (sl && dragId) { e.preventDefault(); $$('.slot.over', el).forEach((x) => x.classList.remove('over')); sl.classList.add('over'); } });
    left.addEventListener('drop', (e) => {
      const sl = e.target.closest('.slot'); if (!sl || !dragId) return; e.preventDefault();
      const a = ACT[dragId], d = +sl.dataset.d, s = +sl.dataset.s, why = canPlace(a, d, s);
      if (why) { sl.classList.add('shake'); setTimeout(() => sl.classList.remove('shake'), 500); toast(a.name, why); dragId = null; $$('.slot', el).forEach((x) => x.classList.remove('can', 'cant', 'over')); return; }
      place(a, d, s); dragId = null; update();
      const ns = $('.slot[data-d="' + d + '"][data-s="' + s + '"]'); if (ns) ns.classList.add('flash');
    });
  }
  function toast(t, m) { AA.toast(t, m); }

  /* ---------------- proposal ---------------- */
  function proposal(c) {
    const b = c.b, h = HOT[st.hotel], tr = TR[st.transport], over = c.price > b.budget, win = c.score >= 75 && !over;
    const ref = 'AAT-' + (1000 + Math.floor(Math.random() * 9000)), dt = new Date(), until = new Date(Date.now() + 7 * 864e5);
    const f = (d) => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    let xp = 0, verdict;
    if (win) {
      const key = 'dubai-' + b.id, first = !AA.state.done[key];
      xp = first ? 200 + Math.max(0, c.score - 75) * 4 : 30; AA.state.done[key] = Math.max(AA.state.done[key] || 0, c.score); if (c.score > (AA.state.best.dubai || 0)) AA.state.best.dubai = c.score; AA.save();
      if (!st.won) { st.won = true; AA.addXP(xp, 'Client said YES - ' + b.name); AA.confetti(); if (c.score >= 90) AA.unlock('dubai_pro'); if (st.margin >= 18) AA.unlock('profit'); }
      verdict = '<div class="verdict yes"><b>&#127881; ' + esc(b.name) + ' accepted your proposal!</b><span>Satisfaction ' + c.score + '/100 &middot; margin ' + st.margin + '% &middot; profit AED ' + money(c.profit) + '</span></div>';
    } else {
      verdict = '<div class="verdict no"><b>&#9888; The client wants changes</b><span>' + (over ? 'Price is AED ' + money(c.price - b.budget) + ' over budget. ' : '') + (c.score < 75 ? 'Satisfaction ' + c.score + '/100 - they need 75+. ' : '') + 'Use the coach tips and try again.</span></div>';
    }
    const days = st.days.map((day, d) => {
      const rows = day.map((v, s) => (v && v[0] !== '~') ? '<tr><td>' + SLN[SL[s]] + '</td><td>' + ACT[v].e + ' ' + esc(ACT[v].name) + '</td></tr>' : '').join('') || '<tr><td colspan="2" class="free">Free time</td></tr>';
      return '<div class="pd"><h5>Day ' + (d + 1) + (d === 0 ? ' - Arrival in Dubai' : d === st.days.length - 1 ? ' - Departure' : '') + '</h5><table>' + rows + '</table></div>';
    }).join('');
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="modal-box wide"><button class="modal-x noprint">&times;</button>' + '<div class="noprint">' + verdict + '</div>' +
      '<div class="paper"><header><div><b class="ptitle">AKBAR ACADEMY TOURS</b><small>Dubai Experience Proposal</small></div><div class="pref"><b>' + ref + '</b><small>' + f(dt) + ' &middot; valid until ' + f(until) + '</small></div></header>' +
      '<div class="pcl"><div><small>PREPARED FOR</small><b>' + esc(b.name) + '</b><span>' + esc(b.from) + '</span></div><div><small>TRAVELLERS</small><b>' + b.adults + ' adult' + (b.adults > 1 ? 's' : '') + (b.kids ? ' + ' + b.kids + ' children' : '') + '</b><span>' + b.nights + ' nights &middot; ' + MN[b.month - 1] + '</span></div><div><small>STAY</small><b>' + esc(h.name) + '</b><span>' + '★'.repeat(h.tier) + ' &middot; ' + b.rooms + ' room' + (b.rooms > 1 ? 's' : '') + '</span></div><div><small>GETTING AROUND</small><b>' + esc(tr.name) + '</b><span>+ airport transfers</span></div></div>' +
      '<h4>Your itinerary</h4><div class="pdays">' + days + '</div>' +
      '<h4>Included</h4><p class="pinc">' + b.nights + ' nights at ' + esc(h.name) + ' &middot; all listed experiences &middot; ' + esc(tr.name) + ' &middot; return airport transfers &middot; UAE tourist visas for ' + c.pax + ' traveller(s).</p>' +
      '<div class="pprice"><div><small>TOTAL</small><b>AED ' + money(c.price) + '</b></div><div><small>PER PERSON</small><b>AED ' + money(c.price / c.pax) + '</b></div><div><small>DEPOSIT TO CONFIRM (30%)</small><b>AED ' + money(c.price * .3) + '</b></div></div>' +
      '<footer>Illustrative training proposal - prices are simulated. Flights not included. Akbar Academy &middot; onlinecourses.akbaracademy.com</footer></div>' +
      '<div class="row noprint" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="pPrint">&#128424; Print / Save PDF</button><button class="btn gold" id="pClose">Keep editing</button></div></div>';
    document.body.appendChild(m);
    const close = () => m.remove(); $('.modal-x', m).onclick = close; $('#pClose', m).onclick = close; $('#pPrint', m).onclick = () => window.print();
    m.addEventListener('click', (e) => { if (e.target === m) close(); });
  }

  function unmount() { /* nothing to tear down */ }
  AA.register({
    id: 'dubai', title: 'Dubai Studio', tagline: 'Itineraries, costing & client proposals', icon: '🏙', status: 'live', badge: '4 client briefs - 24 experiences', mount: mount, unmount: unmount,
    pitch: 'Plan day-by-day trips on a live map. Balance cost, margin, season, heat and pace to win the client.',
    features: ['Drag & drop planner with live map routes', 'Live costing, margin & profit', 'Client satisfaction engine with a coach', 'Printable branded proposal (PDF)'],
  });
})();

</script>
<script>
/* Roadmap modules. Each one is a placeholder that shows how little code a new simulator needs:
   copy this block, change the fields, and replace mount() with the real thing (see README.md). */
(function () {
  'use strict';
  const SOON = [
    { id: 'visa', title: 'Visa Interview', tagline: 'AI examiner & document check', icon: '🛂', badge: 'Planned',
      pitch: 'Face a tough consular officer, defend your documents and learn the refusal reasons before the real day.',
      features: ['Branching interview with scoring', 'Document checklist builder', 'Refusal letter analysis'] },
    { id: 'cabin', title: 'Cabin Crew Drill', tagline: 'Emergencies & service scenarios', icon: '🧑‍✈️', badge: 'Planned',
      pitch: 'Decision-tree scenarios for turbulence, medical events and difficult passengers - timed and scored.',
      features: ['Interactive cabin map', 'Emergency commands', 'Grooming & etiquette checks'] },
    { id: 'airport', title: 'Airport Check-in', tagline: 'Counter, baggage & boarding', icon: '🧳', badge: 'Planned',
      pitch: 'Run a check-in counter: weigh bags, handle special passengers and close the flight on time.',
      features: ['Baggage weight & fees', 'Seat map allocation', 'Boarding gate rush'] },
    { id: 'fares', title: 'Fare Builder', tagline: 'Rules, taxes & refunds', icon: '🧮', badge: 'Planned',
      pitch: 'Construct international fares, apply fare rules and calculate change and refund penalties.',
      features: ['Fare construction (NUC/ROE)', 'Tax breakdown', 'Refund calculator'] },
  ];
  SOON.forEach(function (m) {
    AA.register(Object.assign({}, m, {
      status: 'soon',
      mount: function (el) {
        el.innerHTML =
          '<section class="soon-page card"><span class="eyebrow">Coming soon</span><div class="soon-ico">' + m.icon + '</div><h2>' + AA.esc(m.title) + '</h2><p>' + AA.esc(m.pitch) + '</p>' +
          '<ul>' + m.features.map(function (f) { return '<li>' + AA.esc(f) + '</li>'; }).join('') + '</ul>' +
          '<div class="row" style="justify-content:center"><a class="btn gold" href="#/gds">Try the GDS Lab</a><a class="btn" href="#/dubai">Open Dubai Studio</a></div></section>';
      },
      unmount: function () {},
    }));
  });
})();

</script>
<script>AA.start();</script>
